<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Supabase (free tier) — provides the real online database + real login -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root{
    --paper:#F6F3EC;
    --paper-soft:#EFEAE0;
    --ink:#2A2724;
    --ink-soft:#7A7268;
    --accent:#7D6E83;
    --accent-soft:#C9BFC2;
    --line:#DDD5C4;
    --danger:#A24B3E;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(0,0,0,0.015) 0, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(0,0,0,0.015) 0, transparent 40%);
    z-index:0;
  }
  .hidden{display:none !important;}

  /* ---------- Lock screen ---------- */
  #lock-screen{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    z-index:10;
    background:var(--paper);
    padding:20px;
  }
  .wordmark{
    font-family:'Lora',serif;
    font-size:28px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink);
    margin-bottom:2px;
  }
  .squiggle{
    width:110px;
    height:10px;
    margin-bottom:36px;
  }
  .lock-form{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }
  #code-input{
    width:240px;
    text-align:center;
    letter-spacing:0.35em;
    font-family:'IBM Plex Mono', monospace;
    font-size:15px;
    padding:12px 10px;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line);
    color:var(--ink);
    outline:none;
    transition:border-color .25s ease;
  }
  #code-input:focus{border-color:var(--accent);}
  #code-input::placeholder{color:var(--accent-soft); letter-spacing:0.2em;}
  .lock-btn{
    font-family:'Inter',sans-serif;
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    background:var(--ink);
    color:var(--paper);
    border:none;
    padding:11px 26px;
    border-radius:var(--radius);
    cursor:pointer;
    transition:background .2s ease, transform .2s ease;
  }
  .lock-btn:hover{background:var(--accent);}
  .lock-btn:active{transform:scale(0.97);}
  .lock-btn[disabled]{opacity:0.5; cursor:default;}
  .lock-error{
    font-size:12px;
    color:var(--danger);
    min-height:16px;
    letter-spacing:0.02em;
    opacity:0;
    transition:opacity .2s ease;
    text-align:center;
    max-width:260px;
  }
  .lock-error.show{opacity:1;}
  .shake{animation:shake .4s ease;}
  @keyframes shake{
    10%,90%{transform:translateX(-2px);}
    20%,80%{transform:translateX(4px);}
    30%,50%,70%{transform:translateX(-7px);}
    40%,60%{transform:translateX(7px);}
  }
  .lock-note{
    margin-top:44px;
    font-size:11px;
    color:var(--ink-soft);
    max-width:300px;
    text-align:center;
    line-height:1.6;
    letter-spacing:0.01em;
  }
  /* .sync-dot{
    display:inline-block;
    width:6px; height:6px;
    border-radius:50%;
    background:var(--accent-soft);
    margin-right:6px;
    vertical-align:middle;
  }
  .sync-dot.live{background:#7C9885;} */

  /* ---------- App ---------- */
  #app{
    max-width:680px;
    margin:0 auto;
    padding:64px 24px 120px;
    position:relative;
    z-index:1;
  }
  header.top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:8px;
  }
  header.top h1{
    font-family:'Lora',serif;
    font-weight:500;
    font-size:26px;
    margin:0;
    letter-spacing:0.01em;
  }
  #lock-again{
    background:none;
    border:none;
    font-family:'Inter',sans-serif;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    cursor:pointer;
    padding:4px 0;
  }
  #lock-again:hover{color:var(--ink);}
  .today{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:8px;
    letter-spacing:0.02em;
  }
  .sync-status{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    margin-bottom:32px;
  }

  .toolbar{
    display:flex;
    gap:10px;
    margin-bottom:36px;
  }
  #search-input{
    flex:1;
    font-family:'Inter',sans-serif;
    font-size:13px;
    padding:10px 12px;
    background:var(--paper-soft);
    border:1px solid var(--line);
    border-radius:var(--radius);
    color:var(--ink);
    outline:none;
  }
  #search-input:focus{border-color:var(--accent-soft);}
  #new-entry-btn, #export-btn{
    font-family:'Inter',sans-serif;
    font-size:12px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    background:var(--ink);
    color:var(--paper);
    border:none;
    padding:0 18px;
    border-radius:var(--radius);
    cursor:pointer;
    white-space:nowrap;
  }
  #new-entry-btn:hover, #export-btn:hover{background:var(--accent);}
  #export-btn{
    background:transparent;
    color:var(--ink-soft);
    border:1px solid var(--line);
  }
  #export-btn:hover{color:var(--ink); background:transparent; border-color:var(--ink-soft);}

  /* Entry editor */
  #editor{
    border-top:1px solid var(--line);
    padding-top:28px;
    margin-bottom:48px;
  }
  #entry-title{
    width:100%;
    font-family:'Lora',serif;
    font-size:21px;
    font-style:italic;
    border:none;
    background:transparent;
    outline:none;
    color:var(--ink);
    margin-bottom:14px;
  }
  #entry-title::placeholder{color:var(--accent-soft); font-style:italic;}
  #entry-body{
    width:100%;
    min-height:220px;
    font-family:'Lora',serif;
    font-size:16px;
    line-height:1.85;
    border:none;
    background:transparent;
    outline:none;
    resize:vertical;
    color:var(--ink);
  }
  #entry-body::placeholder{color:var(--accent-soft);}
  .editor-actions{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:10px;
    margin-top:18px;
  }
  .saving-indicator{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    margin-right:auto;
    opacity:0;
    transition:opacity .2s ease;
  }
  .saving-indicator.show{opacity:1;}
  .btn-ghost{
    font-family:'Inter',sans-serif;
    font-size:12px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    background:none;
    border:1px solid var(--line);
    color:var(--ink-soft);
    padding:9px 16px;
    border-radius:var(--radius);
    cursor:pointer;
  }
  .btn-ghost:hover{color:var(--ink); border-color:var(--ink-soft);}
  .btn-solid{
    font-family:'Inter',sans-serif;
    font-size:12px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    background:var(--ink);
    color:var(--paper);
    border:none;
    padding:9px 18px;
    border-radius:var(--radius);
    cursor:pointer;
  }
  .btn-solid[disabled]{opacity:0.5; cursor:default;}
  .btn-solid:hover{background:var(--accent);}

  /* Entries list */
  #entries-list{list-style:none; margin:0; padding:0;}
  .entry-card{
    position:relative;
    padding:22px 4px 22px 0;
    border-top:1px solid var(--line);
    cursor:pointer;
  }
  .entry-card:last-child{border-bottom:1px solid var(--line);}
  .entry-card::before{
    content:"";
    position:absolute;
    left:-24px;
    top:22px;
    width:10px;
    height:10px;
    border-left:1px solid var(--accent-soft);
    border-bottom:1px solid var(--accent-soft);
    opacity:0;
    transform:rotate(45deg);
    transition:opacity .2s ease, left .2s ease;
  }
  .entry-card:hover::before{opacity:1; left:-18px;}
  .entry-date{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:0.03em;
    display:block;
    margin-bottom:6px;
  }
  .entry-title{
    font-family:'Lora',serif;
    font-size:19px;
    font-style:italic;
    margin:0 0 6px;
    color:var(--ink);
  }
  .entry-excerpt{
    font-size:13.5px;
    color:var(--ink-soft);
    line-height:1.6;
    margin:0;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .entry-delete{
    position:absolute;
    right:0;
    top:22px;
    background:none;
    border:none;
    font-size:11px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--accent-soft);
    cursor:pointer;
    opacity:0;
    transition:opacity .2s ease;
  }
  .entry-card:hover .entry-delete{opacity:1;}
  .entry-delete:hover{color:var(--danger);}

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
    font-size:13.5px;
    line-height:1.7;
  }
  .empty-state .squiggle{margin:0 auto 18px;}

  footer.foot{
    text-align:center;
    margin-top:60px;
    font-size:11px;
    color:var(--accent-soft);
    letter-spacing:0.02em;
  }

  @media (max-width:480px){
    #app{padding:48px 18px 100px;}
    .entry-card::before{display:none;}
  }
</style>
</head>
<body>

<!-- ============ LOCK SCREEN ============ -->
<div id="lock-screen">
  <div class="wordmark">Journal</div>
  <svg class="squiggle" viewBox="0 0 110 10" xmlns="http://www.w3.org/2000/svg">
    <path d="M2 6 C 18 -2, 28 14, 44 6 S 74 -2, 90 6 S 106 10, 108 6" fill="none" stroke="#7D6E83" stroke-width="1.4" stroke-linecap="round"/>
  </svg>
  <form class="lock-form" id="lock-form" autocomplete="off">
    <input type="password" id="code-input" placeholder="passcode" autocomplete="off" />
    <button type="submit" class="lock-btn" id="lock-btn">Unlock</button>
    <div class="lock-error" id="lock-error"></div>
  </form>
  <p class="lock-note"><span class="sync-dot" id="sync-dot"></span></p>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <header class="top">
    <h1>Journal</h1>
    <button id="lock-again">Lock</button>
  </header>
  <div class="today" id="today-date"></div>
  <div class="sync-status" id="sync-status">syncing…</div>

  <div class="toolbar">
    <input type="text" id="search-input" placeholder="Search entries…" />
    <button id="new-entry-btn">New entry</button>
    <button id="export-btn">Export</button>
  </div>

  <div id="editor" class="hidden">
    <input type="text" id="entry-title" placeholder="Untitled" />
    <textarea id="entry-body" placeholder="Write what's on your mind…"></textarea>
    <div class="editor-actions">
      <span class="saving-indicator" id="saving-indicator">saving…</span>
      <button class="btn-ghost" id="cancel-btn">Cancel</button>
      <button class="btn-solid" id="save-btn">Save entry</button>
    </div>
  </div>

  <ul id="entries-list"></ul>

  <div class="empty-state hidden" id="empty-state">
    <svg class="squiggle" viewBox="0 0 110 10" xmlns="http://www.w3.org/2000/svg">
      <path d="M2 6 C 18 -2, 28 14, 44 6 S 74 -2, 90 6 S 106 10, 108 6" fill="none" stroke="#C9BFC2" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
    <div>No entries yet. Start with today.</div>
  </div>

  <footer class="foot">private · missjen_</footer>
</div>

<script>
(function(){
  "use strict";

  // ======================================================================
  // 1) SUPABASE SETUP — replace with your own project's values.
  //    See README.md for how to create this in ~5 minutes, for free.
  //    The anon key below is safe to publish; real access control comes
  //    from your Row Level Security policies + the login below, not from
  //    hiding this value.
  // ======================================================================
  const SUPABASE_URL = "https://xdbnexzoeyjgntdihgkl.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhkYm5leHpvZXlqZ250ZGloZ2tsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4ODEwNzgsImV4cCI6MjEwMzQ1NzA3OH0.GOMPLifaCrrGo2qsUw-Uzh83ZoTcEZFmTHnFEAuWXPg";

  // The one Supabase Auth account this journal logs into.
  // Create this user in Supabase Dashboard → Authentication (see README).
  const JOURNAL_EMAIL = "jheenpatac24@gmail.com";

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ---- UI refs ----
  const lockScreen = document.getElementById("lock-screen");
  const app = document.getElementById("app");
  const lockForm = document.getElementById("lock-form");
  const codeInput = document.getElementById("code-input");
  const lockBtn = document.getElementById("lock-btn");
  const lockError = document.getElementById("lock-error");
  const syncDot = document.getElementById("sync-dot");
  const syncStatus = document.getElementById("sync-status");

  lockForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const passcode = codeInput.value.trim();
    if(!passcode) return;
    lockBtn.disabled = true;
    lockError.classList.remove("show");
    const { error } = await supabase.auth.signInWithPassword({
      email: JOURNAL_EMAIL,
      password: passcode
    });
    lockBtn.disabled = false;
    if(error){
      lockError.textContent = "that's not it — try again";
      lockError.classList.add("show");
      lockForm.classList.add("shake");
      setTimeout(()=> lockForm.classList.remove("shake"), 400);
      codeInput.value = "";
      codeInput.focus();
    }
    // success is handled by onAuthStateChange below
  });

  document.getElementById("lock-again").addEventListener("click", () => {
    supabase.auth.signOut();
  });

  supabase.auth.onAuthStateChange((event, session) => {
    if(session){
      lockScreen.classList.add("hidden");
      app.classList.remove("hidden");
      codeInput.value = "";
      startListening(session.user.id);
    } else {
      app.classList.add("hidden");
      lockScreen.classList.remove("hidden");
      stopListening();
      codeInput.focus();
    }
  });

  // ---- Diary entries (Supabase Postgres table, live-synced) ----
  let entries = [];
  let realtimeChannel = null;
  let editingId = null;
  let currentUserId = null;

  const listEl = document.getElementById("entries-list");
  const emptyState = document.getElementById("empty-state");
  const editor = document.getElementById("editor");
  const titleInput = document.getElementById("entry-title");
  const bodyInput = document.getElementById("entry-body");
  const searchInput = document.getElementById("search-input");
  const savingIndicator = document.getElementById("saving-indicator");

  document.getElementById("today-date").textContent = new Date().toLocaleDateString(undefined, {
    weekday: "long", year: "numeric", month: "long", day: "numeric"
  });

  async function fetchEntries(){
    const { data, error } = await supabase
      .from("entries")
      .select("*")
      .order("created_at", { ascending: false });
    if(error){
      syncStatus.textContent = "sync error — check RLS policies";
      syncDot.classList.remove("live");
      console.error(error);
      return;
    }
    entries = data || [];
    syncStatus.textContent = "synced";
    syncDot.classList.add("live");
    renderEntries();
  }

  function startListening(uid){
    currentUserId = uid;
    syncStatus.textContent = "connecting…";
    fetchEntries();
    realtimeChannel = supabase
      .channel("entries-changes")
      .on("postgres_changes", { event: "*", schema: "public", table: "entries" }, () => {
        fetchEntries();
      })
      .subscribe();
  }

  function stopListening(){
    if(realtimeChannel){ supabase.removeChannel(realtimeChannel); realtimeChannel = null; }
    entries = [];
    currentUserId = null;
    listEl.innerHTML = "";
  }

  function fmtDate(iso){
    if(!iso) return "";
    return new Date(iso).toLocaleDateString(undefined, { month:"short", day:"numeric", year:"numeric" });
  }

  function renderEntries(){
    const q = searchInput.value.trim().toLowerCase();
    const filtered = entries.filter(e =>
      !q || (e.title||"").toLowerCase().includes(q) || (e.body||"").toLowerCase().includes(q)
    );

    listEl.innerHTML = "";
    emptyState.classList.toggle("hidden", filtered.length > 0);

    filtered.forEach(entry => {
      const li = document.createElement("li");
      li.className = "entry-card";
      li.innerHTML = `
        <span class="entry-date">${fmtDate(entry.created_at)}</span>
        <h3 class="entry-title">${escapeHtml(entry.title || "Untitled")}</h3>
        <p class="entry-excerpt">${escapeHtml(entry.body || "")}</p>
        <button class="entry-delete" data-id="${entry.id}">Delete</button>
      `;
      li.addEventListener("click", (e) => {
        if(e.target.classList.contains("entry-delete")) return;
        openEditor(entry.id);
      });
      li.querySelector(".entry-delete").addEventListener("click", async (e) => {
        e.stopPropagation();
        if(confirm("Delete this entry? This can't be undone.")){
          await supabase.from("entries").delete().eq("id", entry.id);
          fetchEntries();
        }
      });
      listEl.appendChild(li);
    });
  }

  function escapeHtml(str){
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function openEditor(id){
    editingId = id || null;
    if(id){
      const entry = entries.find(e => e.id === id);
      titleInput.value = entry.title || "";
      bodyInput.value = entry.body || "";
    } else {
      titleInput.value = "";
      bodyInput.value = "";
    }
    editor.classList.remove("hidden");
    titleInput.focus();
    editor.scrollIntoView({behavior:"smooth", block:"start"});
  }

  function closeEditor(){
    editor.classList.add("hidden");
    editingId = null;
    titleInput.value = "";
    bodyInput.value = "";
  }

  document.getElementById("new-entry-btn").addEventListener("click", () => openEditor(null));
  document.getElementById("cancel-btn").addEventListener("click", closeEditor);

  document.getElementById("save-btn").addEventListener("click", async () => {
    const title = titleInput.value.trim();
    const body = bodyInput.value.trim();
    if(!title && !body) return;

    savingIndicator.classList.add("show");
    try{
      let error;
      if(editingId){
        ({ error } = await supabase.from("entries").update({ title, body }).eq("id", editingId));
      } else {
        ({ error } = await supabase.from("entries").insert({ title, body, user_id: currentUserId }));
      }
      if(error) throw error;
      closeEditor();
      fetchEntries();
    } catch(err){
      alert("Couldn't save — check your connection or RLS policies.");
      console.error(err);
    } finally {
      savingIndicator.classList.remove("show");
    }
  });

  searchInput.addEventListener("input", renderEntries);

  document.getElementById("export-btn").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(entries, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "journal-backup-" + new Date().toISOString().slice(0,10) + ".json";
    a.click();
    URL.revokeObjectURL(url);
  });

})();
</script>
</body>
</html>
